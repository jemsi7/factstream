<!DOCTYPE html>
<html class="light" lang="ko">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>News Timeline - 뉴스의 결말까지 한눈에</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a73e8",
                        "primary-hover": "#1557b0",
                    },
                    fontFamily: {
                        "sans": ["Inter", "Noto Sans KR", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }

        .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: rgba(223, 225, 229, 0);
        }
    </style>
</head>

<body class="bg-white min-h-screen flex flex-col">
    <!-- Header -->
    <header class="flex justify-end items-center px-4 py-3 gap-4">
        <!-- 로그인 버튼 비활성화 -->
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-16">
        <!-- Logo Section -->
        <div class="flex flex-col items-center mb-8">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-12 h-12 text-primary">
                    <svg class="w-full h-full" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path clip-rule="evenodd"
                            d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"
                            fill="currentColor" fill-rule="evenodd"></path>
                    </svg>
                </div>
                <h1 class="text-[44px] font-normal text-gray-800 tracking-tight">
                    <span class="text-primary">News</span><span class="text-gray-600">Timeline</span>
                </h1>
            </div>
        </div>

        <!-- Search Box -->
        <div class="w-full max-w-[584px] mb-8">
            <div
                class="search-box flex items-center w-full h-12 border border-gray-200 rounded-full px-4 transition-all duration-200 bg-white">
                <span class="material-symbols-outlined text-gray-400 text-xl mr-3">link</span>
                <input type="text"
                    class="flex-1 h-full border-0 outline-none text-base text-gray-700 placeholder:text-gray-400 bg-transparent"
                    placeholder="뉴스 기사 URL을 붙여넣으세요" />
                <span
                    class="material-symbols-outlined text-primary text-xl ml-3 cursor-pointer hover:text-primary-hover">search</span>
            </div>
        </div>

        <!-- 사용 방법 버튼 비활성화 -->
    </main>

    <!-- Footer -->
    <footer class="py-4 px-4">
        <div class="border-t border-gray-200 pt-4">
            <div class="flex justify-center max-w-[1200px] mx-auto">
                <span class="text-[13px] text-gray-500">© 2024 News Timeline</span>
            </div>
        </div>
    </footer>

    <script>
        const searchInput = document.querySelector('input[placeholder="뉴스 기사 URL을 붙여넣으세요"]');
        const searchIcon = document.querySelector('.material-symbols-outlined.text-primary');

        function analyzeUrl() {
            const url = searchInput.value.trim();
            if (!url) {
                alert('URL을 입력해주세요.');
                return;
            }

            // URL 유효성 검사
            try {
                new URL(url);
            } catch {
                alert('올바른 URL 형식이 아닙니다.');
                return;
            }

            // 로딩 페이지로 이동 (SSE 스트리밍)
            window.location.href = `/loading?url=${encodeURIComponent(url)}`;
        }

        // 클릭 이벤트
        searchIcon.addEventListener('click', analyzeUrl);

        // Enter 키 이벤트
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analyzeUrl();
        });
    </script>
</body>

</html>
